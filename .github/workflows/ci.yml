name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The test suite synthesises sample media with ffmpeg, so the binary has
      # to be present on the runner, not just installed in the container image.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build also runs the TypeScript check, so this covers type errors.
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image
    # The image is what Render and Dokploy actually run, so it gets built on
    # main and on demand rather than on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  licenses:
    name: Dependency license report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python licenses
        run: |
          pip install -r backend/requirements.txt pip-licenses
          mkdir -p licenses
          pip-licenses --format=markdown --with-urls --output-file=licenses/python.md
          echo '--- Copyleft and non-OSI licenses in Python dependencies ---'
          pip-licenses --format=csv | grep -Ei 'GPL|SSPL|RSAL|AGPL' || echo 'none'

      - name: Node licenses
        working-directory: frontend
        run: |
          npm ci
          npx --yes license-checker --production --json --out ../licenses/node.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: licenses/
          retention-days: 30

      # docs/licensing.md is written by hand. When a dependency changes its
      # license, this job's artifact is the source of truth to diff it against.
