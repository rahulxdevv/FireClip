# One-click Render Blueprint for FireClip.
# Creates a single web service (Next.js + FastAPI in one image, inline jobs)
# and a free PostgreSQL database. Media lives on the container filesystem,
# which is ephemeral on the free plan - configure S3 for durable media.
services:
  - type: web
    name: fireclip-rahulxdevv
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fireclip-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: JOB_RUNNER
        value: inline
      - key: AUTO_MIGRATE
        value: "false"
      - key: FRONTEND_URL
        value: https://fireclip-rahulxdevv.onrender.com
      - key: BACKEND_PUBLIC_URL
        value: https://fireclip-rahulxdevv.onrender.com
      - key: CORS_ORIGINS
        value: https://fireclip-rahulxdevv.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: TRANSCRIPTION_ENGINE
        value: faster_whisper
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: AI_PROVIDER
        value: heuristic
      - key: ALLOW_MOCK_TRANSCRIPTION
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "1024"
      - key: PLAN_CLIP_LIMIT
        value: "100"
      - key: PLAN_RENDER_MINUTES
        value: "120"

databases:
  - name: fireclip-db
    plan: free
    databaseName: fireclip
    user: fireclip
