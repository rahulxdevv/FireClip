name: fireclip

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fireclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireclip}
      POSTGRES_DB: ${POSTGRES_DB:-fireclip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fireclip} -d ${POSTGRES_DB:-fireclip}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend_env
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fireclip}:${POSTGRES_PASSWORD:-fireclip}@postgres:5432/${POSTGRES_DB:-fireclip}
      REDIS_URL: redis://redis:6379/0
      JOB_RUNNER: arq
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random bytes)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
      AUTO_MIGRATE: "false"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@fireclip.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FireClip}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
      STRIPE_PRICE_STARTER_MONTH: ${STRIPE_PRICE_STARTER_MONTH:-}
      STRIPE_PRICE_STARTER_YEAR: ${STRIPE_PRICE_STARTER_YEAR:-}
      STRIPE_PRICE_STUDIO_MONTH: ${STRIPE_PRICE_STUDIO_MONTH:-}
      STRIPE_PRICE_STUDIO_YEAR: ${STRIPE_PRICE_STUDIO_YEAR:-}
      STRIPE_PRICE_AGENCY_MONTH: ${STRIPE_PRICE_AGENCY_MONTH:-}
      STRIPE_PRICE_AGENCY_YEAR: ${STRIPE_PRICE_AGENCY_YEAR:-}
      TRANSCRIPTION_ENGINE: ${TRANSCRIPTION_ENGINE:-faster_whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
      RENDER_CRF: ${RENDER_CRF:-20}
      RENDER_X264_PRESET: ${RENDER_X264_PRESET:-veryfast}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DIARIZATION_MODE: ${DIARIZATION_MODE:-off}
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      CAMPAIGN_FEED_URL: ${CAMPAIGN_FEED_URL:-}
      CAMPAIGN_FEED_TOKEN: ${CAMPAIGN_FEED_TOKEN:-}
      CAMPAIGN_FEED_LABEL: ${CAMPAIGN_FEED_LABEL:-Content Rewards}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-fireclip}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      PLAN_CLIP_LIMIT: ${PLAN_CLIP_LIMIT:-500}
      PLAN_RENDER_MINUTES: ${PLAN_RENDER_MINUTES:-600}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      HWACCEL: ${HWACCEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      # The API always listens on 8000 inside the compose network. API_PORT
      # changes only the optional host mapping, so a proxy or Dokploy domain
      # can always target container port 8000.
      PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["worker"]
    environment: *backend_env
    volumes:
      - media:/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Fixed internal origin baked into Next rewrites. API_PORT only changes
        # the host mapping, so changing it never requires a web rebuild.
        API_BASE_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      # Next always listens on 3000 inside the network. WEB_PORT changes only
      # the optional host mapping; a proxy or Dokploy domain targets 3000.
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
